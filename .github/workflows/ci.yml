name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meterflow_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript Compilation
        run: npm run typecheck

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Database Push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meterflow_test_db?schema=public
        run: npx prisma db push

      - name: Seed Test Database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meterflow_test_db?schema=public
        run: npm run seed

      - name: Execute Automated Acceptance Probes & Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meterflow_test_db?schema=public
          MOCK_STRIPE: "true"
          STRIPE_SECRET_KEY: "sk_test_placeholder_ci"
          STRIPE_WEBHOOK_SECRET: "whsec_placeholder_ci"
        run: npm run test

      - name: Build Application
        run: npm run build
